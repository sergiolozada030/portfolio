<!-- ==========================================================================
     Modern Portfolio Layout - Angular 18 Structure
     ========================================================================== -->

<div class="app">
  <!-- Header Navigation -->
  <app-header></app-header>

  <!-- Main Content Area -->
  <main class="app__main" role="main">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- Scroll to Top Button -->
  @if (showScrollButton()) {
  <button
    class="app__scroll-button"
    (click)="scrollToTop()"
    type="button"
    aria-label="Volver arriba"
  ></button>
  }
</div>
